name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: macrorss
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MACRORSS_DB_HOST: 127.0.0.1
      MACRORSS_DB_PORT: 3306
      MACRORSS_DB_USER: root
      MACRORSS_DB_PASSWORD: root
      MACRORSS_DB_NAME: macrorss
      MACRORSS_TEST_MYSQL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python scripts/apply_schema.py
      - run: ruff check .
      - run: python -m compileall -q macrorss tests
      - run: pytest --cov=macrorss --cov-report=term-missing
      - run: macrorss check-config
      - run: macrorss check-db
