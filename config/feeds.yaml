# MacroRSS — Fuentes de primera mano para trading de Gold (XAUUSD) y Forex
# URLs verificadas con curl el 2026-08-25 (ver doc/fuentes-primera-mano-gold-fx.md)
#
# tags:
#   us_macro       — núcleo macro EE.UU. (mueve USD, yields y XAUUSD)
#   gold           — relevante para XAUUSD
#   fx             — relevante para pares FX
#   central_banks  — bancos centrales no-EE.UU.
#   regulation     — regulación, sanciones, posicionamiento
#   commodities    — mercado de oro/commodities propiamente dicho
#
# rank_gold / rank_fx: orden de impacto (1 = mayor) según el listado acordado.
# enabled: false => fuente sin RSS confiable (scraping/newsletter), documentada pero inactiva.

version: 1

defaults:
  # BLS (y otros sitios .gov) devuelven 403 sin User-Agent de navegador
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
  timeout_seconds: 15

feeds:
  # ── Núcleo macro EE.UU. (compartido gold + fx) ──────────────────────────────
  - id: fed-monetary
    name: "Federal Reserve — Monetary Policy / FOMC"
    url: "https://www.federalreserve.gov/feeds/press_monetary.xml"
    tags: [us_macro, gold, fx]
    rank_gold: 1
    rank_fx: 1
    notes: "Comunicados FOMC y política monetaria. Driver #1 de oro (tasa real) y USD."

  - id: fed-press-all
    name: "Federal Reserve — All Press Releases"
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    tags: [us_macro, gold, fx]
    rank_gold: 1
    rank_fx: 1
    notes: "Incluye supervision, enforcement y anuncios no-FOMC. Redundante parcialmente con fed-monetary."

  - id: bls-latest
    name: "BLS — Latest Numbers (CPI, NFP, PPI, JOLTS)"
    url: "https://www.bls.gov/feed/bls_latest.rss"
    tags: [us_macro, gold, fx]
    rank_gold: 2
    rank_fx: 2
    requires_user_agent: true
    notes: "403 sin User-Agent de navegador. CPI y NFP son los datos que más mueven USD intradía."

  - id: bea-news
    name: "BEA — News (GDP, PCE, Personal Income)"
    url: "https://www.bea.gov/news/rss"
    tags: [us_macro, gold, fx]
    rank_gold: 3
    rank_fx: 3
    notes: "Core PCE = indicador de inflación preferido de la Fed."

  - id: treasury-federal-register
    name: "U.S. Treasury — vía Federal Register (deuda, OFAC, sanciones)"
    url: "https://www.federalregister.gov/documents/search?conditions%5Bagencies%5D%5B%5D=treasury-department&format=rss"
    tags: [us_macro, gold, fx, regulation]
    rank_gold: 4
    rank_fx: 5
    notes: "Treasury eliminó su RSS propio. Federal Register cubre OFAC/sanciones; para auctions/press usar home.treasury.gov (sin RSS)."

  - id: presidential-docs
    name: "Federal Register — Presidential Documents (órdenes ejecutivas, tarifas)"
    url: "https://www.federalregister.gov/documents/search?conditions%5Btype%5D%5D=PRESDOCU&format=rss"
    tags: [us_macro, gold, fx, regulation, geopolitics]
    rank_gold: 5
    rank_fx: 5
    notes: "Tarifas y órdenes ejecutivas: en 2024-2025 movieron oro y USD más que muchos datos macro."

  # ── Bancos centrales (FX + contexto de riesgo) ─────────────────────────────
  - id: ecb-mid
    name: "ECB — Market Information Dissemination"
    url: "https://mid.ecb.europa.eu/rss/mid.xml"
    tags: [fx, central_banks]
    rank_fx: 4
    notes: "Canal del ECB diseñado para distribución de releases. EURUSD = par más líquido."

  - id: ecb-press
    name: "ECB — Press Releases"
    url: "https://www.ecb.europa.eu/rss/press.html"
    tags: [fx, central_banks]
    rank_fx: 4
    notes: "Complementario al MID."

  - id: boj-news
    name: "Bank of Japan — What's New"
    url: "https://www.boj.or.jp/en/rss/whatsnew.xml"
    tags: [fx, central_banks]
    rank_fx: 6
    notes: "USDJPY. Ojo: la intervención cambiaria la decide el MOF, no el BoJ."

  - id: boe-news
    name: "Bank of England — News"
    url: "https://www.bankofengland.co.uk/rss/news"
    tags: [fx, central_banks]
    rank_fx: 7
    notes: "GBP, el major más volátil."

  - id: snb-news
    name: "SNB — News"
    url: "https://www.snb.ch/public/rss/en/news"
    tags: [fx, central_banks]
    rank_fx: 8
    notes: "CHF: historial de shocks (techo EURCHF 2015)."

  - id: snb-mopo
    name: "SNB — Monetary Policy"
    url: "https://www.snb.ch/public/rss/en/mopo"
    tags: [fx, central_banks]
    rank_fx: 8
    notes: "Decisiones de política monetaria del SNB."

  - id: bis-cbspeeches
    name: "BIS — Central Bank Speeches (todos los BCs)"
    url: "https://www.bis.org/doclist/cbspeeches.rss"
    tags: [fx, central_banks]
    rank_fx: 9
    notes: "Un solo feed que agrega discursos de todos los banqueros centrales del mundo."

  - id: boc-feed
    name: "Bank of Canada — Feed"
    url: "https://www.bankofcanada.ca/feed/"
    tags: [fx, central_banks]
    rank_fx: 10
    notes: "CAD."

  # ── Regulación y posicionamiento ───────────────────────────────────────────
  - id: cftc-press
    name: "CFTC — Press Releases"
    url: "https://www.cftc.gov/RSS/RSSGP/rssgp.xml"
    tags: [regulation, gold, fx]
    rank_gold: 8
    rank_fx: 11
    notes: "Anuncios regulatorios; el COT (posicionamiento en futuros de oro/FX) se publica semanalmente en la web, no por RSS."

  - id: cftc-enforcement
    name: "CFTC — Enforcement Actions"
    url: "https://www.cftc.gov/RSS/RSSENF/rssenf.xml"
    tags: [regulation]
    notes: "Secundario: shocks regulatorios en mercados de futuros."

  - id: sec-press
    name: "SEC — Press Releases"
    url: "https://www.sec.gov/news/pressreleases.rss"
    tags: [regulation]
    notes: "Solo shocks financieros/regulatorios grandes que afecten riesgo global."

  # ── Sin RSS confiable: documentadas, deshabilitadas ────────────────────────
  - id: wgc
    name: "World Gold Council"
    url: null
    enabled: false
    tags: [gold, commodities]
    rank_gold: 6
    notes: "Demanda de bancos centrales, flujos ETF — el comprador marginal del oro. Sin RSS: scraping de gold.org o newsletter."

  - id: cme-group
    name: "CME Group — Media Room (márgenes COMEX, contratos)"
    url: null
    enabled: false
    tags: [gold, commodities]
    rank_gold: 7
    notes: "Hikes de margen en GC fuerzan liquidaciones. Sin RSS confiable."

  - id: lbma
    name: "LBMA — News & Publications"
    url: null
    enabled: false
    tags: [gold, commodities]
    rank_gold: 9
    notes: "Benchmarks y reformas del mercado físico londinense. Sin RSS."

  - id: mof-japan
    name: "Ministry of Finance Japan — Intervención cambiaria"
    url: null
    enabled: false
    tags: [fx, central_banks]
    rank_fx: 6
    notes: "Fuente primaria de intervención en USDJPY (la ejecuta el MOF). Sin RSS confiable: monitorear web + datos mensuales."

  - id: rba
    name: "Reserve Bank of Australia"
    url: "https://www.rba.gov.au/rss/"
    enabled: false
    tags: [fx, central_banks]
    rank_fx: 10
    notes: "AUD. El índice de feeds existe pero devuelve 403 a bots; verificar manualmente los XML individuales."

  - id: imf
    name: "IMF — News"
    url: "https://www.imf.org/en/RSS-Feeds"
    enabled: false
    tags: [fx, geopolitics]
    rank_fx: 12
    notes: "Crisis de balanza de pagos en EM. Bloquea bots (403); requiere User-Agent completo o scraping."
