[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macrorss"
version = "0.0.1"
description = "Agregación y procesamiento de feeds RSS macroeconómicos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "maximilianolucius" }]
keywords = ["rss", "macro", "macroeconomics", "feeds", "news"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
macrorss = "macrorss.cli:main"

[project.urls]
Homepage = "https://github.com/maximilianolucius/macrorss"
Issues = "https://github.com/maximilianolucius/macrorss/issues"

[tool.setuptools.packages.find]
include = ["macrorss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
