[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macrorss"
version = "0.1.0"
description = "Low-latency, resilient macro event sensor for Gold (XAUUSD) and FX."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "maximilianolucius" }]
keywords = ["rss", "macro", "macroeconomics", "forex", "gold", "xauusd", "news"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "httpx[http2]>=0.27,<1",
    "feedparser>=6.0.11,<7",
    "PyYAML>=6.0,<7",
    "asyncmy>=0.2.9,<1",
    "pyzmq>=26,<28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
macrorss = "macrorss.cli:main"

[project.urls]
Homepage = "https://github.com/maximilianolucius/macrorss"
Issues = "https://github.com/maximilianolucius/macrorss/issues"

[tool.setuptools.packages.find]
include = ["macrorss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
